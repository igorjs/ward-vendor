# SPDX-License-Identifier: Apache-2.0
#
# Static analysis for the workflow files themselves. Runs actionlint on
# every PR and on every push to main that touches .github/workflows/**.
# Catches the kind of issues the security_reminder_hook flagged manually
# during development (untrusted input interpolation, missing pins,
# unreachable jobs, etc.).
#
# `actionlint` is a required status check in the main-branch ruleset,
# so the pull_request trigger must NOT be path-filtered: a required
# check that never reports leaves the PR stuck in "Expected" and
# blocks auto-merge (this is what stalled the watch-upstream bump
# PRs). The job takes seconds, so it simply runs on every PR.

name: lint

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/dependabot.yml

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          # Download the pinned actionlint binary directly rather than
          # piping its installer to bash. Pinning by version + verifying
          # the downloaded tarball SHA gives a real integrity check that
          # `curl | bash` doesn't.
          curl --fail --silent --show-error --location \
            -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint
        run: ./actionlint -color
